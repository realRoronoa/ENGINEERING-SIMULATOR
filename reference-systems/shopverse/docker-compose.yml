version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: shopverse-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: shopverse
    ports:
      - '5433:5432'
    volumes:
      - shopverse_pg_data:/var/lib/postgresql/data
      - ./src/db/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql
      - ./src/db/seed.sql:/docker-entrypoint-initdb.d/02_seed.sql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d shopverse']
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: shopverse-api
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT: 4000
      SHOPVERSE_DATABASE_URL: postgresql://postgres:postgres@db:5432/shopverse
    ports:
      - '4000:4000'

volumes:
  shopverse_pg_data:
